module_path: github.com/mycompany/myapp
project_root: .
output_dir: docs

info:
  title: My API
  description: API documentation
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.example.com
    description: Production

routers:
  - source: internal/api/router.go
    output: swagger.yaml

    info:
      title: My API v1
      version: 1.0.0

    tags:
      - name: users
        description: Users operations
        groups:
          - /users
      - name: products
        description: Products operations
        paths:
          - /products
      - name: public
        paths:
          - /api/v1/health
        security:
          - noAuth

    security_schemes:
      BearerAuth:
        type: http
        scheme: bearer
        bearer_format: JWT
      ApiKeyAuth:
        type: apiKey
        in: header
        name: X-API-Key

    default_security:
      - BearerAuth

    include:
      - /api/v1/*
    exclude:
      - /internal/*
